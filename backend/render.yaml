# Render blueprint for the API. Free plan sleeps after 15 minutes idle, so the
# first request after a quiet spell takes ~50 seconds. Fine for QA, not for a
# live shop.
services:
  - type: web
    name: attume-api
    runtime: node
    plan: free
    rootDir: backend
    # --include=dev is required: NODE_ENV=production makes npm skip
    # devDependencies, and the TypeScript build needs @types/node.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      # Cookies travel over HTTPS. SameSite stays lax because the storefront
      # proxies the API onto its own origin — see next.config rewrites.
      - key: COOKIE_SECURE
        value: 'true'
      - key: COOKIE_SAMESITE
        value: lax
      - key: MONGODB_URI
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: STOREFRONT_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ADMIN_JWT_ACCESS_SECRET
        generateValue: true
      - key: ADMIN_JWT_REFRESH_SECRET
        generateValue: true
