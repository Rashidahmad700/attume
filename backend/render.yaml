# Render blueprint for the API. Free plan sleeps after 15 minutes idle, so the
# first request after a quiet spell takes ~50 seconds. Fine for QA, not for a
# live shop.
services:
  - type: web
    name: attume-api
    runtime: node
    plan: free
    rootDir: backend
    # --include=dev is required: NODE_ENV=production makes npm skip
    # devDependencies, and the TypeScript build needs @types/node.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      # Cookies travel over HTTPS. SameSite stays lax because the storefront
      # proxies the API onto its own origin — see next.config rewrites.
      - key: COOKIE_SECURE
        value: 'true'
      - key: COOKIE_SAMESITE
        value: lax
      - key: MONGODB_URI
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: STOREFRONT_URL
        sync: false
      # Must equal API_PROXY_SECRET on the storefront (Vercel). Without it every
      # shopper shares one login and OTP rate limit.
      - key: API_PROXY_SECRET
        sync: false
      # Email. Without RESEND_API_KEY no mail leaves the server — reset links are
      # only printed to the log. MAIL_FROM must be on a domain verified in Resend.
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      # Where new pre-bookings are announced. Undeclared, this silently falls
      # back to the default in config/env.ts and a wrong inbox looks identical
      # to no mail at all.
      - key: ADMIN_NOTIFY_EMAIL
        sync: false
      - key: ADMIN_WHATSAPP_NUMBER
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ADMIN_JWT_ACCESS_SECRET
        generateValue: true
      - key: ADMIN_JWT_REFRESH_SECRET
        generateValue: true
